<main class="clients-shell">
  <section class="clients-card" aria-live="polite">
    <header class="clients-header">
      <div>
        <p class="eyebrow">Mini Banque</p>
        <h1>Clients</h1>
      </div>
      <div class="header-actions">
        <button type="button" class="primary" (click)="startNewClient()">Nouveau client</button>
        <button type="button" class="secondary" (click)="backToHome()">Retour accueil</button>
      </div>
    </header>

    <section class="create-client-card" *ngIf="showCreateClientForm()">
      <h2>Nouveau client</h2>
      <form [formGroup]="createClientForm" (ngSubmit)="submitNewClient()" novalidate>
        <label class="field">
          <span>Nom</span>
          <input type="text" formControlName="nom" [attr.aria-invalid]="nomControl.invalid && nomControl.touched" />
        </label>
        <p class="field-error" *ngIf="nomControl.invalid && nomControl.touched">Nom requis (2 caracteres min.).</p>

        <label class="field">
          <span>Email</span>
          <input
            type="email"
            formControlName="email"
            [attr.aria-invalid]="emailControl.invalid && emailControl.touched"
          />
        </label>
        <p class="field-error" *ngIf="emailControl.invalid && emailControl.touched">Email valide requis.</p>

        <p class="state error" *ngIf="createClientError()">{{ createClientError() }}</p>

        <div class="form-actions">
          <button type="submit" class="primary" [disabled]="isCreatingClient()">
            {{ isCreatingClient() ? 'Creation...' : 'Creer client' }}
          </button>
          <button type="button" class="ghost" (click)="cancelNewClient()">Annuler</button>
        </div>
      </form>
    </section>

    <p class="state loading" *ngIf="isLoading()">Chargement des clients...</p>

    <section class="state error" *ngIf="errorMessage()">
      <p>{{ errorMessage() }}</p>
      <div class="error-actions">
        <button type="button" *ngIf="unauthorized()" (click)="goToLogin()">Se reconnecter</button>
        <button type="button" *ngIf="!unauthorized()" (click)="loadClients()">Reessayer</button>
      </div>
    </section>

    <section *ngIf="!isLoading() && !errorMessage()" class="clients-content">
      <p class="state empty" *ngIf="clients().length === 0">Aucun client disponible.</p>

      <ul class="clients-list" *ngIf="clients().length > 0">
        <li class="client-item" *ngFor="let client of clients()">
          <h2>{{ client.nom }}</h2>
          <p>{{ client.email }}</p>
        </li>
      </ul>
    </section>
  </section>
</main>
