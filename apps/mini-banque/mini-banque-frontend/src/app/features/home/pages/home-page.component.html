<main class="home-shell">
  <section class="home-card" aria-live="polite">
    <header class="topbar">
      <div>
        <p class="eyebrow">Mini Banque</p>
        <h1>Espace conseiller</h1>
      </div>

      <div class="menu-wrap">
        <button
          class="menu-trigger"
          type="button"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="menu"
          aria-label="Ouvrir le menu utilisateur"
        >
          {{ authStore.username() || 'conseiller' }}
        </button>

        <div class="menu-panel" role="menu" *ngIf="menuOpen()">
          <button type="button" role="menuitem" (click)="openClientsPage()">Clients</button>
          <button type="button" role="menuitem" (click)="logout()">Se deconnecter</button>
        </div>
      </div>
    </header>

    <section class="content-panel">
      <h2>Bienvenue {{ authStore.username() || 'conseiller' }}</h2>
      <p>Utilisez le menu utilisateur pour acceder a la route clients ou vous deconnecter.</p>
    </section>
  </section>
</main>
