<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate aria-labelledby="login-title">
    <h1 id="login-title">Connexion — Banque Crédit</h1>

    <div class="form-field">
      <label for="username">Nom d'utilisateur</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        [attr.aria-invalid]="form.get('username')!.invalid && form.get('username')!.touched"
      />
      @if (form.get('username')!.invalid && form.get('username')!.touched) {
        <span class="field-error">Le nom d'utilisateur est obligatoire</span>
      }
    </div>

    <div class="form-field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="form.get('password')!.invalid && form.get('password')!.touched"
      />
      @if (form.get('password')!.invalid && form.get('password')!.touched) {
        <span class="field-error">Le mot de passe est obligatoire</span>
      }
    </div>

    @if (errorMessage()) {
      <p class="state-message state-message--error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Connexion en cours…' : 'Se connecter' }}
    </button>
  </form>
</div>
