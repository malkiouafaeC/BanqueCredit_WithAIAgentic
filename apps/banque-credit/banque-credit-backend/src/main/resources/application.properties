spring.application.name=banque-credit-backend

server.servlet.context-path=/banque-credit

# H2 file-mode persistence (DEC-007)
spring.datasource.url=jdbc:h2:file:./data/banquecredit;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 console disabled by default (enable only in dev profile if needed)
spring.h2.console.enabled=false

# JWT configuration
# SEC-FIX (AgentSecurity) : secret externalisable via variable d'environnement JWT_SECRET.
# La valeur ci-dessous n'est qu'un defaut de developpement local (pedagogique) ; en production,
# definir JWT_SECRET (ou app.jwt.secret via config server) avec une valeur forte et non commitee.
app.jwt.secret=${JWT_SECRET:ChangeMeInProdBanqueCreditSuperSecretKeyForHS256Signing123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CORS (SEC-FIX AgentSecurity) : origines explicites, externalisables via CORS_ALLOWED_ORIGINS
# (liste separee par virgules). Defaut = frontend Angular dev local uniquement.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging.level.formulAI.project.bank.banqueCredit=INFO

